[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babeling-api"
version = "0.1.0"
description = "FastAPI service for Babeling"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "modal",
  "sqlalchemy",
  "psycopg[binary]",
  "PyJWT",
  "cryptography",
  "httpx",
  "requests",
  "pillow",
  "EbookLib",
  "beautifulsoup4",
  "python-multipart",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]